<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 240" width="250" height="240" role="img" aria-labelledby="t">
  <title id="t">Gatinho de pijama espiando e fazendo joinha</title>
  <defs>
    <path id="estrela" d="M0 -5 L1.5 -1.6 L5 -1.5 L2.3 0.8 L3.2 4.6 L0 2.4 L-3.2 4.6 L-2.3 0.8 L-5 -1.5 L-1.5 -1.6 Z" fill="#ffd23f"/>
  </defs>
  <style>
    .ln { stroke: #2b2b2b; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }

    #gatinho {
      transform-origin: 110px 240px;
      animation: espiar 7s cubic-bezier(.45,.05,.35,1) infinite;
    }
    #pata {
      transform-origin: 198px 240px;
      animation: joinha 7s ease-in-out infinite;
    }
    #olho-dir {
      transform-box: fill-box;
      transform-origin: center;
      animation: piscar 7s linear infinite;
    }
    #orelha-esq {
      transform-origin: 70px 112px;
      animation: orelha 7s ease-in-out infinite;
    }
    #brilho {
      transform-box: fill-box;
      transform-origin: center;
      animation: brilhar 7s ease-out infinite;
    }

    @keyframes espiar {
      0%, 8%   { transform: translateY(175px) rotate(-14deg); }
      34%      { transform: translateY(0) rotate(-7deg); }
      42%      { transform: translateY(0) rotate(0deg); }
      84%      { transform: translateY(0) rotate(0deg); }
      96%, 100%{ transform: translateY(175px) rotate(-14deg); }
    }
    @keyframes joinha {
      0%, 38%  { transform: translateY(150px) rotate(10deg); }
      45%      { transform: translateY(-8px) rotate(-10deg); }
      49%      { transform: translateY(0) rotate(0deg); }
      53%      { transform: translateY(0) rotate(-7deg); }
      57%      { transform: translateY(0) rotate(0deg); }
      61%      { transform: translateY(0) rotate(-7deg); }
      65%      { transform: translateY(0) rotate(0deg); }
      80%      { transform: translateY(0) rotate(0deg); }
      90%, 100%{ transform: translateY(150px) rotate(10deg); }
    }
    @keyframes piscar {
      0%, 50%  { transform: scaleY(1); }
      52%, 60% { transform: scaleY(.12); }
      62%, 100%{ transform: scaleY(1); }
    }
    @keyframes orelha {
      0%, 68%  { transform: rotate(0deg); }
      70%      { transform: rotate(-12deg); }
      72%      { transform: rotate(4deg); }
      74%, 100%{ transform: rotate(0deg); }
    }
    @keyframes brilhar {
      0%, 46%  { transform: scale(0) rotate(0deg); opacity: 0; }
      52%      { transform: scale(1.2) rotate(45deg); opacity: 1; }
      64%      { transform: scale(.9) rotate(90deg); opacity: 1; }
      72%, 100%{ transform: scale(0) rotate(120deg); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      #gatinho, #pata, #olho-dir, #orelha-esq, #brilho { animation: none; }
    }
  </style>

  <!-- Gatinho: pijama, orelhas, cabeça e touca -->
  <g id="gatinho">
    <!-- blusa do pijama -->
    <path class="ln" d="M50 240 Q52 196 110 186 Q168 196 170 240 Z" fill="#7aa7ff"/>
    <use href="#estrela" x="72" y="218"/>
    <use href="#estrela" x="148" y="220"/>
    <use href="#estrela" x="88" y="236"/>
    <use href="#estrela" x="134" y="236"/>
    <!-- gola -->
    <path class="ln" d="M110 190 L86 186 L94 206 Z" fill="#ffffff"/>
    <path class="ln" d="M110 190 L134 186 L126 206 Z" fill="#ffffff"/>
    <circle class="ln" cx="110" cy="214" r="3.5" fill="#ffffff" style="stroke-width:2"/>
    <circle class="ln" cx="110" cy="230" r="3.5" fill="#ffffff" style="stroke-width:2"/>

    <!-- orelhas -->
    <g id="orelha-esq">
      <path class="ln" d="M56 120 L62 58 L104 92 Z" fill="#f6a75e"/>
      <path d="M66 104 L68 72 L92 92 Z" fill="#ff9eb5"/>
    </g>
    <path class="ln" d="M164 120 L158 58 L116 92 Z" fill="#f6a75e"/>
    <path d="M154 104 L152 72 L128 92 Z" fill="#ff9eb5"/>

    <!-- cabeça -->
    <ellipse class="ln" cx="110" cy="136" rx="62" ry="53" fill="#f6a75e"/>
    <!-- listras de gato -->
    <path d="M50 124 Q60 126 66 130 M49 140 Q58 140 64 143" fill="none" stroke="#d9823b" stroke-width="4" stroke-linecap="round"/>
    <path d="M170 124 Q160 126 154 130 M171 140 Q162 140 156 143" fill="none" stroke="#d9823b" stroke-width="4" stroke-linecap="round"/>
    <!-- focinho claro -->
    <ellipse cx="110" cy="158" rx="26" ry="18" fill="#fff1e0"/>

    <!-- bochechas -->
    <ellipse cx="74" cy="152" rx="9" ry="6" fill="#ff9eb5" opacity=".8"/>
    <ellipse cx="146" cy="152" rx="9" ry="6" fill="#ff9eb5" opacity=".8"/>

    <!-- olho esquerdo -->
    <g>
      <ellipse cx="88" cy="134" rx="8.5" ry="10.5" fill="#2b2b2b"/>
      <circle cx="91" cy="130" r="3" fill="#ffffff"/>
      <circle cx="85.5" cy="138.5" r="1.4" fill="#ffffff"/>
    </g>
    <!-- olho direito (pisca) -->
    <g id="olho-dir">
      <ellipse cx="132" cy="134" rx="8.5" ry="10.5" fill="#2b2b2b"/>
      <circle cx="135" cy="130" r="3" fill="#ffffff"/>
      <circle cx="129.5" cy="138.5" r="1.4" fill="#ffffff"/>
    </g>

    <!-- nariz e boquinha -->
    <path class="ln" d="M104 149 L116 149 L110 156 Z" fill="#ff7a93" style="stroke-width:2"/>
    <path class="ln" d="M110 156 L110 160 M100 159 Q105 166 110 160 Q115 166 120 159" fill="none" style="stroke-width:2.5"/>

    <!-- bigodes -->
    <path d="M84 156 L58 151 M84 162 L58 164 M136 156 L162 151 M136 162 L162 164" fill="none" stroke="#2b2b2b" stroke-width="2" stroke-linecap="round"/>

    <!-- touca de dormir -->
    <path class="ln" d="M86 94 C86 58 112 38 140 40 C162 42 176 56 182 74 C166 64 150 64 136 92 Z" fill="#7aa7ff"/>
    <use href="#estrela" x="112" y="64"/>
    <use href="#estrela" x="142" y="52"/>
    <path d="M82 96 Q110 84 140 92" fill="none" stroke="#2b2b2b" stroke-width="15" stroke-linecap="round"/>
    <path d="M82 96 Q110 84 140 92" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
    <circle class="ln" cx="183" cy="78" r="8" fill="#ffffff"/>
  </g>

  <!-- Patinha fazendo joinha -->
  <g id="pata">
    <rect class="ln" x="180" y="196" width="36" height="50" rx="4" fill="#7aa7ff"/>
    <use href="#estrela" x="198" y="220"/>
    <rect class="ln" x="174" y="186" width="48" height="13" rx="5" fill="#ffffff"/>
    <rect class="ln" x="181" y="114" width="17" height="44" rx="8.5" fill="#f6a75e"/>
    <ellipse cx="189.5" cy="124" rx="4" ry="3" fill="#ff9eb5"/>
    <rect class="ln" x="176" y="148" width="46" height="40" rx="14" fill="#f6a75e"/>
    <path class="ln" d="M201 159 H219 M201 169 H220 M201 179 H217" fill="none" style="stroke-width:2.5"/>
  </g>

  <!-- brilho -->
  <path id="brilho" d="M228 108 L231 117 L240 120 L231 123 L228 132 L225 123 L216 120 L225 117 Z" fill="#ffd23f" stroke="#2b2b2b" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
