<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 240" width="250" height="240" role="img" aria-labelledby="t">
  <title id="t">Palhacinho espiando e fazendo joinha</title>
  <style>
    .ln { stroke: #2b2b2b; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }

    #palhaco {
      transform-origin: 110px 240px;
      animation: espiar 7s cubic-bezier(.45,.05,.35,1) infinite;
    }
    #mao {
      transform-origin: 198px 240px;
      animation: joinha 7s ease-in-out infinite;
    }
    #olho-dir {
      transform-box: fill-box;
      transform-origin: center;
      animation: piscar 7s linear infinite;
    }
    #brilho {
      transform-box: fill-box;
      transform-origin: center;
      animation: brilhar 7s ease-out infinite;
    }

    @keyframes espiar {
      0%, 8%   { transform: translateY(175px) rotate(-14deg); }
      34%      { transform: translateY(0) rotate(-7deg); }
      42%      { transform: translateY(0) rotate(0deg); }
      84%      { transform: translateY(0) rotate(0deg); }
      96%, 100%{ transform: translateY(175px) rotate(-14deg); }
    }
    @keyframes joinha {
      0%, 38%  { transform: translateY(150px) rotate(10deg); }
      45%      { transform: translateY(-8px) rotate(-10deg); }
      49%      { transform: translateY(0) rotate(0deg); }
      53%      { transform: translateY(0) rotate(-7deg); }
      57%      { transform: translateY(0) rotate(0deg); }
      61%      { transform: translateY(0) rotate(-7deg); }
      65%      { transform: translateY(0) rotate(0deg); }
      80%      { transform: translateY(0) rotate(0deg); }
      90%, 100%{ transform: translateY(150px) rotate(10deg); }
    }
    @keyframes piscar {
      0%, 50%  { transform: scaleY(1); }
      52%, 60% { transform: scaleY(.12); }
      62%, 100%{ transform: scaleY(1); }
    }
    @keyframes brilhar {
      0%, 46%  { transform: scale(0) rotate(0deg); opacity: 0; }
      52%      { transform: scale(1.2) rotate(45deg); opacity: 1; }
      64%      { transform: scale(.9) rotate(90deg); opacity: 1; }
      72%, 100%{ transform: scale(0) rotate(120deg); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      #palhaco, #mao, #olho-dir, #brilho { animation: none; }
    }
  </style>

  <!-- Palhaço: corpo, cabelo, rosto e chapéu -->
  <g id="palhaco">
    <!-- corpo -->
    <path class="ln" d="M52 240 Q54 204 110 198 Q166 204 168 240 Z" fill="#ffd23f"/>
    <circle cx="80" cy="222" r="5" fill="#3fa9f5"/>
    <circle cx="110" cy="230" r="5" fill="#3fa9f5"/>
    <circle cx="140" cy="222" r="5" fill="#3fa9f5"/>

    <!-- cabelo -->
    <g class="ln" fill="#ff7a1a">
      <circle cx="66" cy="98" r="12"/>
      <circle cx="56" cy="114" r="14"/>
      <circle cx="51" cy="132" r="14"/>
      <circle cx="57" cy="150" r="13"/>
      <circle cx="154" cy="98" r="12"/>
      <circle cx="164" cy="114" r="14"/>
      <circle cx="169" cy="132" r="14"/>
      <circle cx="163" cy="150" r="13"/>
    </g>

    <!-- rosto -->
    <circle class="ln" cx="110" cy="128" r="58" fill="#fff4ea"/>

    <!-- bochechas -->
    <circle cx="77" cy="147" r="9" fill="#ff9eb5" opacity=".85"/>
    <circle cx="143" cy="147" r="9" fill="#ff9eb5" opacity=".85"/>

    <!-- sobrancelhas -->
    <path class="ln" d="M80 100 Q90 91 100 99" fill="none" stroke="#3a7bd5" stroke-width="4"/>
    <path class="ln" d="M120 99 Q130 91 140 100" fill="none" stroke="#3a7bd5" stroke-width="4"/>

    <!-- olho esquerdo -->
    <g>
      <ellipse class="ln" cx="90" cy="117" rx="9" ry="11" fill="#ffffff"/>
      <circle cx="92" cy="118" r="4.8" fill="#2b2b2b"/>
      <circle cx="93.6" cy="116.2" r="1.6" fill="#ffffff"/>
    </g>
    <!-- olho direito (pisca) -->
    <g id="olho-dir">
      <ellipse class="ln" cx="130" cy="117" rx="9" ry="11" fill="#ffffff"/>
      <circle cx="132" cy="118" r="4.8" fill="#2b2b2b"/>
      <circle cx="133.6" cy="116.2" r="1.6" fill="#ffffff"/>
    </g>

    <!-- boca -->
    <path class="ln" d="M78 148 Q110 192 142 148 Q130 160 110 161 Q90 160 78 148 Z" fill="#e63946"/>
    <path d="M89 156 Q110 180 131 156 Q120 164 110 164 Q100 164 89 156 Z" fill="#7a1020"/>
    <ellipse cx="110" cy="171" rx="9" ry="4.5" fill="#ff8fa3"/>

    <!-- nariz -->
    <circle class="ln" cx="110" cy="137" r="13" fill="#e63946"/>
    <circle cx="105" cy="132" r="4" fill="#ffffff" opacity=".75"/>

    <!-- gravata-borboleta -->
    <path class="ln" d="M110 195 L82 181 L82 209 Z" fill="#8e5cf7"/>
    <path class="ln" d="M110 195 L138 181 L138 209 Z" fill="#8e5cf7"/>
    <circle cx="90" cy="195" r="3" fill="#ffffff"/>
    <circle cx="130" cy="195" r="3" fill="#ffffff"/>
    <circle class="ln" cx="110" cy="195" r="7" fill="#b892ff"/>

    <!-- chapéu de festa -->
    <path class="ln" d="M84 78 L134 66 L114 22 Z" fill="#3fa9f5"/>
    <path d="M97 75 L121 69 L117 60 L100 64 Z" fill="#ffd23f" opacity=".9"/>
    <path d="M104 50 L116 47 L114 42 L106 44 Z" fill="#ffd23f" opacity=".9"/>
    <circle class="ln" cx="114" cy="20" r="7" fill="#ff7a1a"/>
  </g>

  <!-- Mão fazendo joinha -->
  <g id="mao">
    <rect class="ln" x="180" y="196" width="36" height="50" rx="4" fill="#8e5cf7"/>
    <rect class="ln" x="174" y="186" width="48" height="13" rx="5" fill="#3fa9f5"/>
    <rect class="ln" x="181" y="114" width="17" height="44" rx="8.5" fill="#ffffff"/>
    <rect class="ln" x="176" y="148" width="46" height="40" rx="13" fill="#ffffff"/>
    <path class="ln" d="M201 159 H219 M201 169 H220 M201 179 H217" fill="none" stroke-width="2.5"/>
  </g>

  <!-- brilho -->
  <path id="brilho" d="M228 108 L231 117 L240 120 L231 123 L228 132 L225 123 L216 120 L225 117 Z" fill="#ffd23f" stroke="#2b2b2b" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
